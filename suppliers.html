</head>

            <nav>
                <a href="dashboard.html" class="nav-item"> <i class="fas fa-chart-pie"></i> Dashboard</a>
                <a href="inventory.html" class="nav-item"> <i class="fas fa-cubes"></i> Inventory</a>
                <a href="prescription-scanner.html" class="nav-item"> <i class="fas fa-camera-retro"></i> Smart Rx Scan</a>
                <a href="add-medicine.html" class="nav-item"> <i class="fas fa-plus-circle"></i>  Add Medicine</a>   <!-- REMOVED active -->
                <a href="billing.html" class="nav-item"> <i class="fas fa-shopping-cart"></i> Billing POS</a>
                <a href="suppliers.html" class="nav-item active"> <i class="fas fa-truck"></i> Suppliers</a>

            </nav>
        </aside>

        <main class="main-content">
            <div class="card">
                <h3><i class="fas fa-truck"></i> Supplier Directory</h3>
                <table class="data-table">
                    <thead><tr><th>Name</th><th>Contact</th><th>Lead Time</th><th>Rating</th></tr></thead>
                    <tbody id="supplierTableBody"></tbody>
                </table>
            </div>

            <div class="card">
                <h3><i class="fas fa-robot"></i> Auto-Reorder Suggestions</h3>
                <div id="lowStockSuggestions"></div>
                <button id="generatePOBtn">Generate Purchase Order</button>
            </div>
        </main>

       <!-- Bottom Navigation (mobile) updated -->
       <div class="bottom-nav">
        <!-- First 5 (visible initially) -->
        <a href="dashboard.html" class="nav-icon"><i class="fas fa-chart-line"></i><span>Home</span></a>
        <a href="inventory.html" class="nav-icon"><i class="fas fa-boxes"></i><span>Stock</span></a>
        <a href="prescription-scanner.html" class="nav-icon"><i class="fas fa-camera"></i><span>Scan Rx</span></a>
        <a href="add-medicine.html" class="nav-icon"><i class="fas fa-plus-circle"></i><span>Add Med</span></a>

        <!-- Next 5 (scroll to see) -->

        <a href="customers.html" class="nav-icon"><i class="fas fa-users"></i><span>CRM</span></a>
        <a href="reports.html" class="nav-icon"><i class="fas fa-chart-line"></i><span>Reports</span></a>
        <a href="employees.html" class="nav-icon"><i class="fas fa-user-shield"></i><span>Staff</span></a>
        <a href="settings.html" class="nav-icon"><i class="fas fa-sliders-h"></i><span>Settings</span></a>
    </div>
    </div>

    <div class="dark-toggle" id="darkModeToggle"><i class="fas fa-moon"></i> Dark</div>

    <script src="js/app.js"></script>
    <script src="js/utils.js"></script>
    <script>
        function renderSuppliers() {
            const html = suppliers.map(s => `
                <tr>
                    <td><strong>${s.name}</strong></td>
                    <td>${s.contact}</td>
                    <td>${s.leadTime} days</td>
                    <td>⭐ ${s.rating}</td>
                </tr>
            `).join('');
            document.getElementById('supplierTableBody').innerHTML = html;
        }

        function renderReorderSuggestions() {
            const lowStockMeds = medicines.filter(m => m.stock < 10 && m.stock > 0);
            if (lowStockMeds.length === 0) {
                document.getElementById('lowStockSuggestions').innerHTML = '<p>✅ No low stock items. All good!</p>';
                return;
            }
            const list = lowStockMeds.map(m => `<li>${m.name} (${m.stock} left) – Suggest reorder from ${m.supplier || 'default supplier'}</li>`).join('');
            document.getElementById('lowStockSuggestions').innerHTML = `<ul>${list}</ul>`;
        }

        document.getElementById('generatePOBtn')?.addEventListener('click', () => {
            alert('Purchase Order generated for low-stock items. (Demo)');
        });

        renderSuppliers();
        renderReorderSuggestions();
    </script>
</body>
</html>
