<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PharmaPOS AI | Enterprise Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Login page specific styles */
        .login-container {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b3b3f, #144e52);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: var(--card);
            max-width: 420px;
            width: 100%;
            border-radius: 48px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        .login-card .logo {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .login-card h3 {
            margin-bottom: 1.5rem;
            color: var(--text);
        }
        .login-card input, 
        .login-card select {
            margin-bottom: 1rem;
        }
        .demo-note {
            font-size: 12px;
            margin-top: 1rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <i class="fas fa-prescription-bottle"></i> PharmaPOS AI
            </div>
            <h3>Enterprise Pharmacy Suite</h3>
            <p style="margin-bottom: 1rem; color: var(--text-secondary);">Secure Role-Based Access</p>
            
            <select id="roleSelect">
                <option value="owner">👑 Owner (Full Access)</option>
                <option value="pharmacist">💊 Pharmacist (Inventory + Billing)</option>
                <option value="cashier">💰 Cashier (Billing Only)</option>
            </select>
            
            <input type="text" id="loginUser" placeholder="Username" value="admin">
            <input type="password" id="loginPass" placeholder="Password" value="pass">
            
            <button id="loginBtn" class="w-100" style="width: 100%;">Secure Login →</button>
            
            <p class="demo-note">
                <i class="fas fa-info-circle"></i> Demo Credentials: any username/password<br>
                Role selection determines UI permissions
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        /**
         * Login Handler - Authenticates user and redirects to dashboard
         * Stores user role in localStorage for persistence across pages
         */
        document.getElementById('loginBtn').addEventListener('click', function() {
            const selectedRole = document.getElementById('roleSelect').value;
            const username = document.getElementById('loginUser').value || 'User';
            
            // Store session data
            localStorage.setItem('pharmapos_user_role', selectedRole);
            localStorage.setItem('pharmapos_username', username);
            
            // Update global state
            window.currentUserRole = selectedRole;
            window.saveAppState();
            
            // Redirect to dashboard
            window.location.href = 'dashboard.html';
        });
        
        // Allow Enter key to submit
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginBtn').click();
            }
        });
    </script>
</body>
</html>
