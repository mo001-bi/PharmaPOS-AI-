<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | PharmaPOS AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-prescription-bottle"></i> PharmaPOS AI
            </div>
            <nav>
                <a href="dashboard.html" class="nav-item active">
                    <i class="fas fa-chart-pie"></i> Dashboard
                </a>
                <a href="inventory.html" class="nav-item">
                    <i class="fas fa-cubes"></i> Inventory
                </a>
                <a href="prescription-scanner.html" class="nav-item">
                    <i class="fas fa-camera-retro"></i> Smart Rx Scan
                </a>
                <a href="add-medicine.html" class="nav-item">   <!-- ACTIVE REMOVED -->
                    <i class="fas fa-plus-circle"></i> Add Medicine
                </a>
                <a href="billing.html" class="nav-item">
                    <i class="fas fa-shopping-cart"></i> Billing POS
                </a>
                <a href="suppliers.html" class="nav-item">
                    <i class="fas fa-truck"></i> Suppliers
                </a>
                <a href="customers.html" class="nav-item">
                    <i class="fas fa-users"></i> CRM / Loyalty
                </a>
                <a href="reports.html" class="nav-item">
                    <i class="fas fa-chart-line"></i> Analytics
                </a>
                <a href="employees.html" class="nav-item">
                    <i class="fas fa-user-shield"></i> Employees
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="fas fa-sliders-h"></i> Settings
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div id="dashboardContent">
                <!-- Dashboard content loaded dynamically -->
                <div class="grid-4" id="statsCards"></div>
                <div class="grid-2" id="alertsSection"></div>
                <div class="card" id="chartSection">
                    <canvas id="salesChart" height="150"></canvas>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation (Mobile) -->
         <div class="bottom-nav">
            <!-- First 5 (visible initially) -->
            <a href="dashboard.html" class="nav-icon active"><i class="fas fa-chart-line"></i><span>Home</span></a>  <!-- active added here -->
            <a href="inventory.html" class="nav-icon"><i class="fas fa-boxes"></i><span>Stock</span></a>  
            <a href="prescription-scanner.html" class="nav-icon"><i class="fas fa-camera"></i><span>Scan Rx</span></a>
            <a href="add-medicine.html" class="nav-icon"><i class="fas fa-plus-circle"></i><span>Add Med</span></a>
            <a href="billing.html" class="nav-icon"><i class="fas fa-cash-register"></i><span>Bill</span></a>
        
            <!-- Next 5 (scroll to see) -->
            <a href="suppliers.html" class="nav-icon"><i class="fas fa-truck"></i><span>Suppliers</span></a>
            <a href="customers.html" class="nav-icon"><i class="fas fa-users"></i><span>CRM</span></a>
            <a href="reports.html" class="nav-icon"><i class="fas fa-chart-line"></i><span>Reports</span></a>
            <a href="employees.html" class="nav-icon"><i class="fas fa-user-shield"></i><span>Staff</span></a>
            <a href="settings.html" class="nav-icon"><i class="fas fa-sliders-h"></i><span>Settings</span></a>
        </div>
    </div>

    <!-- Dark Mode Toggle -->
    <div class="dark-toggle" id="darkModeToggle">
        <i class="fas fa-moon"></i> Dark
    </div>

    <script src="js/app.js"></script>
    <script src="js/utils.js"></script>
    <script>
        /**
         * Dashboard Page Controller
         * Displays KPI cards, low stock alerts, expiry warnings,
         * and weekly sales chart.
         */
        
        let salesChart = null;
        
        /**
         * Render dashboard statistics and alerts
         */
        function renderDashboard() {
            // Calculate KPIs
            const totalStockUnits = medicines.reduce((sum, m) => sum + m.stock, 0);
            const inventoryValue = calculateInventoryValue();
            const expiringSoon = getExpiringMedicines(30).length;
            const lowStockItems = getLowStockItems(10);
            
            // Render stats cards
            const statsHtml = `
                <div class="card">
                    <i class="fas fa-chart-line" style="font-size: 1.5rem; color: var(--primary);"></i>
                    <h3>₹42,850</h3>
                    <p>Today's Sales</p>
                </div>
                <div class="card">
                    <i class="fas fa-box-open" style="font-size: 1.5rem; color: var(--primary);"></i>
                    <h3>${totalStockUnits}</h3>
                    <p>Total Stock Units</p>
                </div>
                <div class="card">
                    <i class="fas fa-clock" style="font-size: 1.5rem; color: var(--warning);"></i>
                    <h3>${expiringSoon}</h3>
                    <p>Expiry Alerts (30 days)</p>
                </div>
                <div class="card">
                    <i class="fas fa-chart-simple" style="font-size: 1.5rem; color: var(--primary);"></i>
                    <h3>${formatCurrency(inventoryValue)}</h3>
                    <p>Inventory Value</p>
                </div>
            `;
            document.getElementById('statsCards').innerHTML = statsHtml;
            
            // Render alerts (low stock + expiry)
            const lowStockHtml = lowStockItems.map(m => 
                `<div class="stock-orange">⚠️ ${m.name} - Stock: ${m.stock} units</div>`
            ).join('');
            
            const expiryHtml = getExpiringMedicines(30).map(m => 
                `<div class="stock-red">⏰ ${m.name} expires on ${m.expiry}</div>`
            ).join('');
            
            const alertsHtml = `
                <div class="card">
                    <h4><i class="fas fa-exclamation-triangle"></i> Low Stock Alerts</h4>
                    ${lowStockHtml || '<p>✅ All items have sufficient stock</p>'}
                </div>
                <div class="card">
                    <h4><i class="fas fa-calendar-alt"></i> Expiry Warnings</h4>
                    ${expiryHtml || '<p>✅ No near-expiry items</p>'}
                </div>
            `;
            document.getElementById('alertsSection').innerHTML = alertsHtml;
            
            // Render chart
            const ctx = document.getElementById('salesChart').getContext('2d');
            if (salesChart) salesChart.destroy();
            salesChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [{
                        label: 'Sales (₹)',
                        data: [5800, 7200, 6900, 12400, 9800, 15300, 11200],
                        backgroundColor: 'var(--primary)',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { position: 'top' }
                    }
                }
            });
        }
        
        // Initialize dashboard on page load
        document.addEventListener('DOMContentLoaded', () => {
            renderDashboard();
        });
        
        // Listen for cart updates (to refresh if needed)
        window.addEventListener('cart-updated', () => {
            // Optional: update if dashboard shows cart summary
        });
    </script>
</body>
</html>
